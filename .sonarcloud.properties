# Read directly by SonarCloud's "Automatic Analysis" (this repo has no
# CI-based sonar-scanner step - see .github/workflows/docker-publish.yml,
# the only workflow here - so sonar-project.properties, which only applies
# to CI-based scans, would be silently ignored; this file is the one
# Automatic Analysis actually reads).

# backend/src/semp/*.ts and frontend/src/lib/*.ts deliberately duplicate a
# handful of small, framework-free utility functions: wildcard subscription
# coverage (addWildcardCoverageEdges.ts, subscriptionCovers.ts) and the
# topic-to-Sankey-edge conversion (toSankeyEdges.ts). Each file's own doc
# comment says so explicitly (e.g. addWildcardCoverageEdges.ts: "Exact copy
# of frontend/src/lib/addWildcardCoverageEdges.ts").
#
# This is intentional, not an oversight: the two copies serve two
# independently built and deployed artifacts - the Vite SPA vs. the Express
# backend's own /api/sankey-edges feed for Grafana (see README's "Grafana
# path" section) - built in separate Dockerfile stages that don't share a
# filesystem at build time. Actually sharing one real module between them
# would need a workspace/shared-package restructuring that also touches
# both of the Dockerfile's build stages (COPY layers, rootDir/tsconfig,
# emitted output paths) - worth doing deliberately and verified against a
# real `docker build`, not as a drive-by fix for a duplication metric.
# Excluded from the duplication check here rather than actually merged, for
# that reason - see the "Known open items" section in README.md.
sonar.cpd.exclusions=\
  **/addWildcardCoverageEdges.ts,\
  **/addWildcardCoverageEdges.test.ts,\
  **/subscriptionCovers.ts,\
  **/subscriptionCovers.test.ts,\
  **/toSankeyEdges.ts,\
  **/toSankeyEdges.test.ts
