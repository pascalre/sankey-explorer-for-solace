name: Build and publish Docker image

# Publishes the combined frontend+backend image (see Dockerfile) to the
# GitHub Container Registry, so anyone can run the tool with just:
#   docker pull ghcr.io/<owner>/<repo>:latest
#   docker run -p 4000:4000 ghcr.io/<owner>/<repo>:latest
# No Docker Hub account/secret needed - GITHUB_TOKEN (ambient, no setup) is
# enough to push to ghcr.io for this repository.
#
# If `docker pull` ever comes back "denied" even though the package looks
# public: that's almost always a stale/expired cached ghcr.io login on the
# PULLING machine (`docker login ghcr.io` once, then the token expired) -
# `docker logout ghcr.io` fixes it. If the package itself ever gets created
# PRIVATE (can happen depending on repo/org defaults): GitHub profile ->
# Packages -> this image -> Package settings -> Change visibility -> Public.
#
# Builds for both linux/amd64 and linux/arm64 (e.g. Apple Silicon) via QEMU
# emulation - arm64 takes noticeably longer to build than amd64 because of
# that emulation, this is expected.
#
# Every `uses:` below is pinned to a full commit SHA rather than a version
# tag (e.g. `@v4`) - tags can be moved to point at different commits (by
# the action's own maintainer, or by an attacker who compromises their
# account), silently changing what code runs in this workflow with
# `secrets.GITHUB_TOKEN`'s `packages: write` permission. A SHA is the
# actual, immutable commit, with the version kept as a trailing `# vX`
# comment purely for human readability - Dependabot still understands this
# format and opens PRs bumping the SHA (and the comment) when a new version
# is released, so this doesn't mean manually tracking updates forever.
# Each SHA here is the commit `git ls-remote --tags <repo>` resolves that
# version tag to; re-resolve the same way to verify or bump.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image name
        # ghcr.io requires an all-lowercase image name; github.repository
        # usually already is, but this is robust regardless of repo/owner casing.
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU (for cross-building the linux/arm64 image)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
