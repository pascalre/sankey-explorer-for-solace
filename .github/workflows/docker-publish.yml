name: Build and publish Docker image

# Publishes the combined frontend+backend image (see Dockerfile) to the
# GitHub Container Registry, so anyone can run the tool with just:
#   docker pull ghcr.io/<owner>/<repo>:latest
#   docker run -p 4000:4000 ghcr.io/<owner>/<repo>:latest
# No Docker Hub account/secret needed - GITHUB_TOKEN (ambient, no setup) is
# enough to push to ghcr.io for this repository.
#
# ONE-TIME MANUAL STEP after the first successful run: the package ghcr.io
# creates is PRIVATE by default, even in a public repo. Go to your GitHub
# profile -> Packages -> this image -> Package settings -> Change visibility
# -> Public, so others can pull it without authenticating.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        # ghcr.io requires an all-lowercase image name; github.repository
        # usually already is, but this is robust regardless of repo/owner casing.
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
